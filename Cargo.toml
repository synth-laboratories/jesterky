[workspace]
resolver = "2"
members = [
    "crates/jesterky-contract",
    "crates/jesterky-core",
    "crates/jesterky-actor",
    "crates/jesterky-model",
    "crates/jesterky-quality",
    "crates/jesterky-cli",
    "crates/jesterky-proxy",
    "crates/jesterky-sandbox",
]

# Shared package metadata (inherited via `<field>.workspace = true`). Single
# source of truth for the version train and publish identity.
[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/synth-laboratories/jesterky"
homepage = "https://github.com/synth-laboratories/jesterky"
authors = ["Synth Laboratories"]
readme = "README.md"

# Shared dependency versions. Kept deliberately tiny — the OSS core takes on no
# model/HTTP/runtime deps; those live in the host (ADR #6).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
async-recursion = "1"
jesterky-contract = { path = "crates/jesterky-contract", version = "0.1.2" }
jesterky-core = { path = "crates/jesterky-core", version = "0.1.2" }
jesterky-actor = { path = "crates/jesterky-actor", version = "0.1.2" }
jesterky-model = { path = "crates/jesterky-model", version = "0.1.2" }
jesterky-quality = { path = "crates/jesterky-quality", version = "0.1.2" }
jesterky-proxy = { path = "crates/jesterky-proxy", version = "0.1.2" }
jesterky-sandbox = { path = "crates/jesterky-sandbox", version = "0.1.2" }
