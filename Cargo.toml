[workspace]
resolver = "2"
members = [
    "crates/jesterky-contract",
    "crates/jesterky-core",
    "crates/jesterky-actor",
    "crates/jesterky-model",
    "crates/jesterky-quality",
    "crates/jesterky-cli",
]

# Shared dependency versions. Kept deliberately tiny — the OSS core takes on no
# model/HTTP/runtime deps; those live in the host (ADR #6).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
async-recursion = "1"
jesterky-contract = { path = "crates/jesterky-contract" }
jesterky-core = { path = "crates/jesterky-core" }
jesterky-actor = { path = "crates/jesterky-actor" }
jesterky-model = { path = "crates/jesterky-model" }
jesterky-quality = { path = "crates/jesterky-quality" }
