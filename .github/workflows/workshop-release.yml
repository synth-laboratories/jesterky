name: Workshop optional runtime
on:
  workflow_dispatch:
  push:
    branches: [codex/jesterky-workshop-0.1.3]
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p jesterky-core -p jesterky-model -p jesterky-proxy -p jesterky-quality -p jesterky-cli
      - run: python3 scripts/package_workshop.py --output dist/workshop
      - run: python3 scripts/verify_workshop_package.py dist/workshop
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-${{ matrix.os }}
          path: dist/workshop/jesterky-*
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/codex/jesterky-workshop-0.1.3'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable release source
        run: |
          git rev-parse --verify refs/tags/v0.1.3
          git diff --exit-code refs/tags/v0.1.3 HEAD -- Cargo.toml Cargo.lock crates scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: workshop-*
          path: release
          merge-multiple: true
      - name: Publish verified Linux artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v0.1.3
        run: |
          gh release create "$RELEASE_TAG" release/*-linux-* --verify-tag --title "$RELEASE_TAG" --notes 'Workshop optional Jesterky runtime. Linux x86_64 and aarch64 artifacts pass native package verification; JSON receipts pin their bytes. macOS builds are tested in CI but are not published pending Developer ID signing and notarization.'
