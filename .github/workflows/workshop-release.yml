name: Workshop optional runtime
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag
        required: true
        default: v0.1.3
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p jesterky-core -p jesterky-model -p jesterky-proxy -p jesterky-quality -p jesterky-cli
      - run: python3 scripts/package_workshop.py --output dist/workshop
      - run: python3 scripts/verify_workshop_package.py dist/workshop
      - name: Record immutable build source
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          for path in pathlib.Path("dist/workshop").glob("*.json"):
              data = json.loads(path.read_text())
              data["sourceRevision"] = revision
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-${{ matrix.os }}
          path: dist/workshop/jesterky-*
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: workshop-*
          path: release
          merge-multiple: true
      - name: Publish verified Linux artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/publish_workshop.py release --tag "$RELEASE_TAG"
