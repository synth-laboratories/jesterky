name: Workshop optional runtime
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag
        required: true
        default: v0.1.4
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p jesterky-core -p jesterky-model -p jesterky-proxy -p jesterky-quality -p jesterky-cli
      - run: python3 scripts/package_workshop.py --output dist/workshop
      - run: python3 scripts/verify_workshop_package.py dist/workshop
      - uses: actions/upload-artifact@v4
        with:
          name: workshop-${{ matrix.os }}
          path: dist/workshop/jesterky-*
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: workshop-*
          path: release
          merge-multiple: true
      - name: Publish verified Linux and macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: python3 scripts/publish_workshop.py release --tag "$RELEASE_TAG"
