[package]
name = "jesterky-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "The jesterky orchestration core: pure graph execution, events, replay. No IO."
keywords = ["workflow", "orchestration", "dag", "replay", "async"]
categories = ["asynchronous", "data-structures", "development-tools"]

# ADR #6: the core takes on NO model/HTTP/subprocess/runtime deps. All IO crosses
# the seam via the traits in `traits.rs`, implemented by the host. `async-trait`
# and `async-recursion` are orchestration plumbing, not IO.
[dependencies]
jesterky-contract = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
async-recursion = { workspace = true }

[dev-dependencies]
jesterky-actor = { path = "../jesterky-actor" }
tokio = { version = "1", features = ["rt", "macros"] }
