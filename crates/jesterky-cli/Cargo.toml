[package]
name = "jesterky-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "jesterky command-line runner and replay checker."
keywords = ["workflow", "cli", "runner", "replay", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jesterky"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
clap = { version = "4", features = ["derive"] }
jesterky-actor = { workspace = true }
jesterky-contract = { workspace = true }
jesterky-core = { workspace = true }
jesterky-model = { workspace = true }
jesterky-proxy = { workspace = true }
jesterky-quality = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
jsonschema = "0.17"
tempfile = "3"
