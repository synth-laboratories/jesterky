[package]
name = "jesterky-cli"
version = "0.0.0"
edition = "2021"
description = "jesterky command-line runner and replay checker."

[[bin]]
name = "jesterky"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
clap = { version = "4", features = ["derive"] }
jesterky-actor = { workspace = true }
jesterky-contract = { workspace = true }
jesterky-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
