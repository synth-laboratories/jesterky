[package]
name = "jesterky-model"
version = "0.0.0"
edition = "2021"
description = "Model-backed host actors for jesterky: the ModelActor seam adapter + the codex (ChatGPT-bundle) model. This is the M1→M2 step — a real Actor to swap in for FakeActor."

[dependencies]
jesterky-contract = { workspace = true }
jesterky-core = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["process", "rt", "io-util", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
