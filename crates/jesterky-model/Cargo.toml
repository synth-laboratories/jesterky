[package]
name = "jesterky-model"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true
description = "Model-backed host actors for jesterky: the ModelActor seam adapter + the codex (ChatGPT-bundle) model. This is the M1->M2 step — a real Actor to swap in for FakeActor."
keywords = ["workflow", "actor", "llm", "codex", "async"]
categories = ["asynchronous", "development-tools"]

[dependencies]
jesterky-contract = { workspace = true }
jesterky-core = { workspace = true }
jesterky-sandbox = { workspace = true }
jesterky-proxy = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["process", "rt", "io-util", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
