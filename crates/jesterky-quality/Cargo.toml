[package]
name = "jesterky-quality"
version = "0.0.0"
edition = "2021"
description = "The reference M2 workload: a structured code quality scan (expand → map audit dimensions → reduce report) that runs on a jesterky host actor."

[dependencies]
jesterky-core = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jesterky-contract = { workspace = true }
jesterky-actor = { workspace = true }
jesterky-model = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
